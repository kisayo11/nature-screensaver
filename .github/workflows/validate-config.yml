name: Validate screensaver config

on:
  push:
    branches: [ main ]
    paths:
      - 'config.json'
      - 'config.sample.json'
      - 'published-config.json'
      - 'scripts/validate-config.js'
      - '.github/workflows/validate-config.yml'
  pull_request:
    paths:
      - 'config.json'
      - 'config.sample.json'
      - 'published-config.json'
      - 'scripts/validate-config.js'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run validate-config.js
        run: node scripts/validate-config.js
